# AI GitHub Skill Scanner - 配置模板
# 复制此文件为 config.yaml 后按需调整
# 所有可调参数集中在本文件，无需修改代码

system:
  name: "AI GitHub Skill Scanner"
  version: "1.0.0"
  workspace_root: "~/.workbuddy"
  skills_install_dir: "~/.workbuddy/skills"
  data_dir: "./data"
  log_level: "INFO"

# ===== 扫描领域（4大领域，可增删） =====
scan_domains:
  - name: "mcp_skill_plugin"
    description: "MCP/Skill/Plugin生态"
    enabled: true
    keywords:
      - "workbuddy-skill"
      - "workbuddy-plugin"
      - "mcp-server"
      - "model-context-protocol"
      - "claude-skill"
      - "ai-plugin"
    min_stars: 50
    languages: ["python", "typescript", "javascript", "markdown"]

  - name: "ai_agent_llm"
    description: "AI Agent / LLM工具链"
    enabled: true
    keywords:
      - "claude-code"
      - "cursor-rules"
      - "ai-agent"
      - "llm-tool"
      - "agent-framework"
      - "prompt-engineering"
    min_stars: 200
    languages: ["python", "typescript", "rust", "go"]

  - name: "dev_tools"
    description: "通用开发者工具"
    enabled: true
    keywords:
      - "cli-tool"
      - "developer-tools"
      - "productivity"
      - "automation"
      - "workflow"
    min_stars: 500
    languages: ["python", "typescript", "go", "rust"]

  - name: "trending_broad"
    description: "智能判断 - trending广撒网"
    enabled: true
    keywords: []
    use_trending: true
    trending_since: "weekly"
    min_stars: 1000
    max_candidates: 50

# ===== 评分权重（总和必须=1.0） =====
scoring_weights:
  code_quality: 0.25
  activity: 0.25
  community: 0.20
  practicality: 0.20
  safety: 0.10

# ===== 决策阈值 =====
thresholds:
  auto_install: 85
  recommend: 70
  record_only: 50
  # 数据完备性门（v1.2.1）：核心证据(contributors/commits/releases/readme)缺失时，
  # 即使总分≥85也降级为recommend，禁止自动安装（危险动作需完整证据）
  require_full_data_for_auto_install: true

# ===== 安全门规则 =====
safety_gate:
  enabled: true
  block_patterns:           # 命中即阻断安装
    - "curl\\s+.*\\|\\s*(ba)?sh"
    - "wget\\s+.*\\|\\s*(ba)?sh"
    - "rm\\s+-rf\\s+/(\\s|$)"
    - "eval\\s*\\(\\s*base64"
    - "python\\s+-c\\s+['\"]import\\s+os"
    - "os\\.system\\s*\\(\\s*['\"](rm|del|format)"
    - ":(){:|:&};:"
  warn_patterns:            # 命中累计扣分
    - "postinstall"
    - "preinstall"
    - "sudo\\s"
    - "chmod\\s+\\+x"
    - "curl\\s+http://"
  require_license: true
  max_suspicious_score: 30

# ===== GitHub API =====
github:
  api_base: "https://api.github.com"
  use_gh_cli: true
  per_page: 50
  rate_limit_buffer: 100
  cache_ttl_hours: 6

# ===== 报告 =====
report:
  format: ["html", "json"]
  output_dir: "./data/reports"
  include_charts: true
  top_n: 20

# ===== 知识库 =====（v1.2.0 新增）
knowledge_base:
  enabled: true
  kb_root: "~/.workbuddy/knowledge"          # 知识库根目录
  auto_ingest_on_complete: true              # 项目完成时自动归纳入库
  trigger_threshold_tools: 8                 # 工具调用数 ≥ 此值视为"复杂任务"自动触发
  ingest_complete_signals:                   # 自动触发归纳的信号
    - present_files                           # 执行了 present_files
    - git_commit_push                         # 执行了 commit+push
    - user_explicit_done                      # 用户说"做完了/完成了"
  allowed_entry_types:
    - project_summary
    - pattern
    - lesson
  storage_layout:
    projects_subdir: "projects"               # 按月分目录: projects/YYYY-MM/
    patterns_subdir: "patterns"
    lessons_subdir: "lessons"
    tags_subdir: "tags"                       # 自动生成的标签索引
    index_file: "INDEX.md"
  github_sync:
    enabled: true
    repo: "https://github.com/QR-qinrui/QR-git"
    branch: "main"
    include_knowledge: true                   # 同步时附带知识库内容
    auth_preference: "gh-cli"                 # gh-cli | token | auto

# ===== 进化点调整速查 =====
# 进化点1 评分权重调优 → 改 scoring_weights（总和=1.0）
# 进化点2 安全规则扩展 → 改 safety_gate.block_patterns
# 进化点3 扫描领域调整 → 改 scan_domains（增删条目）
# 进化点4 角色协议演进 → 改 references/team_protocol.md + team/protocol.py
# 进化点5 经验沉淀 → references/evolution_log.md 追加记录
# 进化点6 知识库扩展 → 改 knowledge/ 模块 + references/knowledge_protocol.md