name: 功能建议
description: 新流程、新签名、新工具建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不方便、哪个步骤还是手动的、哪类错误没被覆盖
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、入口、命令形态；涉及新脚本时说明放在哪个目录、参数与退出码设计
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎么证明它做对了（可量化的门禁，如 0 控制台错误、API 全 200）
  - type: textarea
    id: context
    attributes:
      label: 补充信息
