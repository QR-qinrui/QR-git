name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip package
        run: |
          mkdir -p dist
          zip -r dist/dsh-maintenance-toolkit.zip . -x './.git/*' './dist/*'
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-maintenance-toolkit.zip
          generate_release_notes: true
