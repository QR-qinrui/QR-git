[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afo-ai-file-organizer"
version = "1.0.0"
description = "AI 资产文件扫描、归类与安全迁移工具（只读扫描、原子迁移、路径透明化、可追溯清单、可回滚）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "QR" }]
keywords = ["file-organizer", "migration", "ai-assets", "junction", "ollama"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
# 运行时零第三方依赖：仅 Python 标准库
dependencies = []

[project.scripts]
afo = "afo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
